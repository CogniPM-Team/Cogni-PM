# Runs the whole product with one command:
#
#   docker compose up --build          then open http://localhost:8000
#   docker compose down                stop it (your data is kept)
#   docker compose down -v             stop it AND delete the database
#
# Two containers: the app (API + website, one image) and PostgreSQL. The app reads your Jira and Gemini settings
# from the .env file in this folder; copy .env.example to .env first. There is no login yet, so both ports are
# bound to this machine only (127.0.0.1): keep it that way.
name: cognipm

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cognipm
      POSTGRES_PASSWORD: cognipm
      POSTGRES_DB: cognipm
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      # For tools and the test suite on your machine. 5433, not 5432, so it does not collide with a PostgreSQL you
      # may already run. Change it with COGNIPM_DB_PORT=... if 5433 is taken too.
      - "127.0.0.1:${COGNIPM_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognipm -d cognipm"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env: inside Docker the database is reached by its service name.
      DATABASE_URL: postgresql://cognipm:cognipm@db:5432/cognipm
    ports:
      - "127.0.0.1:${COGNIPM_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  dbdata:
