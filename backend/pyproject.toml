[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognipm-backend"
version = "0.1.0"
description = "CogniPM backend: Jira connection today; MCP gateway, orchestrator and API to come"
requires-python = ">=3.11"
# Only what the code uses today. Add a dependency in the same PR that first imports it.
# Intended stack for the rest (see README): FastAPI, LangGraph, the MCP SDK, Gemini
# (google-genai), PostgreSQL + pgvector (psycopg).
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["cognipm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: the formatter owns line length; it can't split long strings.
ignore = ["E501"]
