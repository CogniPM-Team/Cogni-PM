name: deploy

# Manual-only for now: there is nothing to deploy yet. Once there is, change the trigger to:
#
#   on:
#     workflow_run:
#       workflows: [ci]
#       types: [completed]
#       branches: [main]
#
# and add `if: github.event.workflow_run.conclusion == 'success'` to the job, so production
# only ever deploys code that passed CI.
#
# Vercel (frontend) and Render (backend) are triggered through deploy hooks stored as
# secrets on the `production` environment, which can require a human reviewer. Turn off each
# platform's own auto-deploy-on-push so this workflow is the only path to production.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy frontend (Vercel)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK_URL not set, skipping"; else curl -fsS -X POST "$HOOK"; fi
      - name: Deploy backend (Render)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL not set, skipping"; else curl -fsS -X POST "$HOOK"; fi
