name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Guard: lets CI pass while frontend/ doesn't exist yet. Delete once it does.
      - id: chk
        working-directory: .
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.chk.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.chk.outputs.present == 'true'
        run: npm ci
      - if: steps.chk.outputs.present == 'true'
        run: npm run lint
      - if: steps.chk.outputs.present == 'true'
        run: npx tsc --noEmit
      - if: steps.chk.outputs.present == 'true'
        run: npm test --if-present
      - if: steps.chk.outputs.present == 'true'
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cognipm
          POSTGRES_PASSWORD: cognipm
          POSTGRES_DB: cognipm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cognipm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cognipm:cognipm@localhost:5432/cognipm_test
    steps:
      - uses: actions/checkout@v4
      # Guard: lets CI pass while backend/ doesn't exist yet. Delete once it does.
      - id: chk
        working-directory: .
        run: echo "present=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.chk.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - if: steps.chk.outputs.present == 'true'
        run: pip install -e ".[dev]"
      - if: steps.chk.outputs.present == 'true'
        run: ruff check .
      - if: steps.chk.outputs.present == 'true'
        run: ruff format --check .
      - if: steps.chk.outputs.present == 'true'
        run: pytest -q

  # Single stable check name for the branch ruleset to require, so the ruleset
  # never has to change when jobs above are added, renamed, or skipped.
  ci:
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] && [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ]
