name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Guard: frontend/ is empty for now, so skip. Delete this step and every `if:` below
      # once frontend/package.json exists, so a broken frontend can't pass silently.
      - id: chk
        working-directory: .
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.chk.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.chk.outputs.present == 'true'
        run: npm ci
      - if: steps.chk.outputs.present == 'true'
        run: npm run lint
      - if: steps.chk.outputs.present == 'true'
        run: npx tsc --noEmit
      - if: steps.chk.outputs.present == 'true'
        run: npm test --if-present
      - if: steps.chk.outputs.present == 'true'
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # When a test needs PostgreSQL, add `services: postgres: image: pgvector/pgvector:pg16`
      # to this job (with a health check) and set DATABASE_URL.

  # Single stable check name for the branch ruleset to require, so the ruleset
  # never has to change when jobs above are added, renamed, or skipped.
  ci:
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] && [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ]
